<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mesin Dengar</title>
<meta name="theme-color" content="#0E1726">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20512%20512%22%3E%3Crect%20width%3D%22512%22%20height%3D%22512%22%20fill%3D%22%230E1726%22/%3E%3Crect%20x%3D%2296%22%20y%3D%22150%22%20width%3D%22320%22%20height%3D%22190%22%20rx%3D%2236%22%20fill%3D%22%23FFD23F%22/%3E%3Cpath%20d%3D%22M170%20340%20L170%20410%20L250%20340%20Z%22%20fill%3D%22%23FFD23F%22/%3E%3Crect%20x%3D%22140%22%20y%3D%22200%22%20width%3D%22232%22%20height%3D%2222%22%20rx%3D%2211%22%20fill%3D%22%230E1726%22/%3E%3Crect%20x%3D%22140%22%20y%3D%22248%22%20width%3D%22160%22%20height%3D%2222%22%20rx%3D%2211%22%20fill%3D%22%230E1726%22/%3E%3C/svg%3E" type="image/svg+xml">
<style>
:root{--bg:#0E1726;--panel:#16233A;--text:#FFFFFF;--muted:#A9B8D0;--accent:#FFD23F;--onaccent:#0E1726;--stop:#FF6B6B;--line:#2A3A57;--fs:36px}
[data-theme="light"]{--bg:#FAFAF7;--panel:#EEF0F4;--text:#111418;--muted:#4A5565;--accent:#0B57D0;--onaccent:#FFFFFF;--stop:#C5221F;--line:#C9CFD9}
[data-theme="contrast"]{--bg:#000000;--panel:#111111;--text:#FFFF00;--muted:#E6E6A0;--accent:#00FFFF;--onaccent:#000000;--stop:#FF8080;--line:#666600}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
button,select{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--accent);outline-offset:2px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:10px 16px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:22px;font-weight:800;flex:1}
header .status{width:100%;order:3}
.status{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600}
.dot{width:14px;height:14px;border-radius:50%;background:var(--muted)}
.on .dot{background:var(--stop);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.5);opacity:.5}}
select{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:8px 10px;font-size:16px}
main{flex:1;overflow-y:auto;padding:16px;scroll-behavior:smooth}
.line{font-size:var(--fs);line-height:1.3;font-weight:600;margin:0 0 .6em;max-width:28ch;max-width:min(100%,32ch);overflow-wrap:anywhere}
.line time{display:block;font-size:14px;font-weight:400;color:var(--muted);margin-bottom:2px}
.interim{color:var(--accent)}
.empty{color:var(--muted);font-size:var(--fs);line-height:1.3;font-weight:600;max-width:min(100%,32ch);margin:0}
.msg{margin:12px 16px 0;padding:12px 14px;border-radius:12px;background:var(--panel);border-left:6px solid var(--stop);font-size:17px;line-height:1.4}
.msg[hidden]{display:none}
footer{border-top:1px solid var(--line);background:var(--panel);padding:12px 16px;display:flex;flex-direction:column;gap:12px}
.sizebar{display:flex;align-items:center;gap:14px}
.sizebar .a1{font-size:18px;font-weight:800}
.sizebar .a2{font-size:34px;font-weight:800;line-height:1}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:44px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:12px;border-radius:6px;background:var(--line)}
input[type=range]::-moz-range-track{height:12px;border-radius:6px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:40px;height:40px;margin-top:-14px;border-radius:50%;background:var(--accent);border:4px solid var(--bg)}
input[type=range]::-moz-range-thumb{width:32px;height:32px;border-radius:50%;background:var(--accent);border:4px solid var(--bg)}
.controls{display:flex;align-items:center;gap:12px}
.small{min-width:60px;min-height:60px;border-radius:16px;border:2px solid var(--line);background:var(--bg);font-size:22px;font-weight:700;cursor:pointer}
.small:active{background:var(--line)}
.main{flex:1;min-height:72px;padding:0 22px;border-radius:36px;border:0;background:var(--accent);color:var(--onaccent);font-size:24px;font-weight:800;cursor:pointer}
.main.on{background:var(--stop);color:#000}
@media (prefers-reduced-motion:reduce){.on .dot{animation:none}main{scroll-behavior:auto}}
</style>
</head>
<body>
<header>
  <h1>Mesin Dengar</h1>
  <div class="status" id="status" role="status" aria-live="polite"><span class="dot"></span><span id="statusText">Berhenti</span></div>
  <label><span class="sr" style="position:absolute;left:-9999px">Bahasa</span>
    <select id="lang" aria-label="Bahasa">
      <option value="id-ID">Indonesia</option>
      <option value="en-US">English</option>
      <option value="jv-ID">Jawa</option>
      <option value="su-ID">Sunda</option>
    </select>
  </label>
</header>

<div class="msg" id="msg" hidden role="alert"></div>

<main id="out" aria-live="off">
  <p class="empty" id="empty">Tekan <b>Mulai</b>. Ucapan akan muncul di sini.</p>
</main>

<footer>
  <div class="sizebar">
    <span class="a1" aria-hidden="true">A</span>
    <input type="range" id="size" min="18" max="110" step="1" aria-label="Ukuran huruf: geser ke kanan untuk memperbesar, ke kiri untuk memperkecil">
    <span class="a2" aria-hidden="true">A</span>
  </div>
  <div class="controls">
    <button class="small" id="theme" aria-label="Ganti tema warna">◐</button>
    <button class="main" id="toggle" aria-pressed="false">Mulai</button>
    <button class="small" id="clear" aria-label="Hapus semua teks">✕</button>
  </div>
</footer>

<script>
(function(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var $ = function(id){return document.getElementById(id)};
  var out=$('out'), empty=$('empty'), msg=$('msg'), toggle=$('toggle'), statusEl=$('status'), statusText=$('statusText'), langSel=$('lang');
  var themes=['dark','light','contrast'], themeNames={dark:'Gelap',light:'Terang',contrast:'Kontras tinggi'};
  var S={fs:36,theme:'dark',lang:'id-ID'};
  try{var saved=JSON.parse(localStorage.getItem('dengar-settings')||'{}');for(var k in saved)S[k]=saved[k];}catch(e){}

  var rec=null, listening=false, interimEl=null, wakeLock=null, restartTimer=null;

  function save(){try{localStorage.setItem('dengar-settings',JSON.stringify(S));}catch(e){}}
  function apply(){
    document.documentElement.setAttribute('data-theme',S.theme);
    document.documentElement.style.setProperty('--fs',S.fs+'px');
    var m=document.querySelector('meta[name=theme-color]');
    m.content=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
    langSel.value=S.lang;
    var z=document.getElementById('size'); if(z) z.value=S.fs;
  }
  function showMsg(t){msg.textContent=t;msg.hidden=!t;}
  function setState(on){
    listening=on;
    toggle.textContent=on?'Berhenti':'Mulai';
    toggle.classList.toggle('on',on);
    toggle.setAttribute('aria-pressed',on);
    statusEl.classList.toggle('on',on);
    statusText.textContent=on?'Mendengarkan…':'Berhenti';
  }
  function scrollEnd(){out.scrollTop=out.scrollHeight;}
  function now(){return new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});}

  function addFinal(text){
    text=text.trim(); if(!text) return;
    if(empty) empty.hidden=true;
    var p=document.createElement('p'); p.className='line';
    var t=document.createElement('time'); t.textContent=now();
    p.appendChild(t); p.appendChild(document.createTextNode(text));
    if(interimEl&&interimEl.parentNode) out.insertBefore(p,interimEl); else out.appendChild(p);
    if(navigator.vibrate) navigator.vibrate(40);
    scrollEnd();
  }
  function setInterim(text){
    if(!text){ if(interimEl&&interimEl.parentNode) interimEl.remove(); interimEl=null; return; }
    if(empty) empty.hidden=true;
    if(!interimEl){interimEl=document.createElement('p');interimEl.className='line interim';out.appendChild(interimEl);}
    interimEl.textContent=text; scrollEnd();
  }

  async function lockScreen(){
    try{ if('wakeLock' in navigator){ wakeLock=await navigator.wakeLock.request('screen'); } }catch(e){}
  }
  document.addEventListener('visibilitychange',function(){ if(listening&&document.visibilityState==='visible') lockScreen(); });

  var idleCount=0;
  function ensureMic(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) return Promise.resolve();
    return navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){st.getTracks().forEach(function(t){t.stop();});});
  }
  function build(){
    rec=new SR();
    rec.continuous=true; rec.interimResults=true; rec.lang=S.lang; rec.maxAlternatives=1;
    rec.onstart=function(){ if(listening) statusText.textContent='Mikrofon aktif, menunggu suara…'; };
    rec.onaudiostart=function(){ idleCount=0; };
    rec.onspeechstart=function(){ if(listening) statusText.textContent='Suara terdeteksi…'; };
    rec.onspeechend=function(){ if(listening) statusText.textContent='Mendengarkan…'; };
    rec.onresult=function(e){
      idleCount=0; showMsg('');
      var interim='';
      for(var i=e.resultIndex;i<e.results.length;i++){
        var r=e.results[i];
        if(r.isFinal){ setInterim(''); addFinal(r[0].transcript); }
        else interim+=r[0].transcript;
      }
      setInterim(interim);
    };
    rec.onerror=function(e){
      var c=e.error;
      if(c==='no-speech'||c==='aborted') return;
      if(c==='not-allowed'||c==='service-not-allowed'){
        showMsg('Mikrofon diblokir. Ketuk ikon gembok di kolom alamat Chrome → Izin → Mikrofon → Izinkan. Lalu muat ulang halaman dan tekan Mulai.'); stop();
      } else if(c==='audio-capture'){
        showMsg('Mikrofon tidak terdeteksi atau sedang dipakai aplikasi lain. Tutup aplikasi lain yang memakai mikrofon.'); stop();
      } else if(c==='network'){
        showMsg('Tidak ada koneksi internet. Pengenalan suara butuh internet.');
      } else if(c==='language-not-supported'){
        showMsg('Bahasa ini belum didukung di HP ini. Pilih bahasa Indonesia.'); stop();
      } else {
        showMsg('Terjadi kesalahan pengenalan suara ('+c+').');
      }
    };
    rec.onend=function(){
      setInterim('');
      if(!listening) return;
      idleCount++;
      if(idleCount>6){ showMsg('Pengenalan suara terus berhenti sendiri. Pastikan internet aktif dan buka lewat Chrome langsung, bukan dari aplikasi lain.'); stop(); return; }
      clearTimeout(restartTimer);
      restartTimer=setTimeout(function(){
        try{ rec.start(); }
        catch(e){ build(); try{ rec.start(); }catch(e2){ showMsg('Gagal memulai ulang. Tekan Mulai lagi.'); stop(); } }
      },300);
    };
  }
  function start(){
    showMsg('');
    if(location.protocol==='file:'||window.isSecureContext===false){
      showMsg('Halaman ini tidak aman untuk mikrofon (dibuka dari file lokal). Unggah ke GitHub Pages lalu buka alamat https://-nya di Chrome.'); return;
    }
    idleCount=0; setState(true); statusText.textContent='Meminta izin mikrofon…';
    ensureMic().then(function(){
      if(!listening) return;
      build();
      try{ rec.start(); lockScreen(); }
      catch(e){ showMsg('Gagal memulai. Muat ulang halaman lalu tekan Mulai.'); stop(); }
    }).catch(function(){
      showMsg('Izin mikrofon ditolak. Ketuk ikon gembok di kolom alamat Chrome → Izin → Mikrofon → Izinkan, lalu muat ulang.'); stop();
    });
  }
  function stop(){
    setState(false); clearTimeout(restartTimer);
    try{rec&&rec.stop();}catch(e){}
    setInterim('');
    if(wakeLock){try{wakeLock.release();}catch(e){} wakeLock=null;}
  }

  if(!SR){
    showMsg('Browser ini belum mendukung pengenalan suara. Buka lewat Google Chrome (Android) atau Safari terbaru (iPhone).');
    toggle.disabled=true; toggle.style.opacity=.5;
  }
  (function(){
    var ua=navigator.userAgent, w='';
    if(window.self!==window.top) w='Halaman ini terbuka di dalam bingkai/pratinjau, sehingga mikrofon diblokir. Buka langsung di Chrome.';
    else if(/FBAN|FBAV|Instagram|Line\/|MicroMessenger|WhatsApp|; wv\)/i.test(ua)) w='Anda membuka lewat browser dalam aplikasi lain. Buka lewat Google Chrome agar mikrofon bisa dipakai.';
    else if(location.protocol==='file:') w='Halaman dibuka dari file lokal, mikrofon tidak akan bekerja. Unggah ke GitHub Pages dan buka lewat alamat https://.';
    if(w) showMsg(w);
  })();
  toggle.onclick=function(){listening?stop():start();};
  var sizeEl=$('size');
  sizeEl.oninput=function(){S.fs=+sizeEl.value;apply();};
  sizeEl.onchange=function(){save();};
  $('theme').onclick=function(){S.theme=themes[(themes.indexOf(S.theme)+1)%themes.length];apply();save();showMsg('');statusText.textContent=listening?'Mendengarkan…':'Tema: '+themeNames[S.theme];};
  $('clear').onclick=function(){
    Array.prototype.slice.call(out.querySelectorAll('.line')).forEach(function(n){n.remove();});
    interimEl=null; empty.hidden=false;
  };
  langSel.onchange=function(){S.lang=langSel.value;save();if(listening){stop();start();}};

  apply();
  try{
    var man={name:'Mesin Dengar',short_name:'Mesin Dengar',lang:'id',start_url:location.href.split('#')[0],display:'standalone',background_color:'#0E1726',theme_color:'#0E1726',icons:[{src:document.querySelector('link[rel=icon]').href,sizes:'any',type:'image/svg+xml'}]};
    var l=document.createElement('link');l.rel='manifest';
    l.href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'}));
    document.head.appendChild(l);
  }catch(e){}
})();
</script>
</body>
</html>
